global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9091"]  # Use Docker service name

  - job_name: "jenkins"
    metrics_path: "/prom"  # Correct path
    static_configs:
      - targets: ["jenkins-blueocean:8080"]  # Jenkins service in Docker network