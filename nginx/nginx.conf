events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://jenkins-blueocean:8080;
            proxy_set_header Host $host:$server_port;  # Sertakan port
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;  # Sertakan port
            proxy_redirect http://localhost http://localhost:9000;  # Perbaiki redirect
        }
    }
}